
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Absensi Expo SMKN 3 Payakumbuh</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <style>
    .fade-slide { animation: fadeSlide 1s ease forwards; opacity: 0; transform: translateY(20px); }
    @keyframes fadeSlide { to { opacity: 1; transform: translateY(0); } }
    .notif { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 1rem 2rem; border-radius: 1rem; box-shadow: 0 4px 20px rgba(0,0,0,0.5); z-index: 1000; }
  </style>
</head>
<body class="bg-gradient-to-b from-gray-900 via-gray-800 to-gray-900 text-white min-h-screen flex flex-col justify-center items-center font-sans">

  <!-- HEADER -->
  <div class="text-center mb-8 fade-slide">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/3c/Google_Gemini_logo.svg/2048px-Google_Gemini_logo.svg.png" alt="Gemini Logo" class="w-16 mx-auto mb-4">
    <h1 class="text-3xl md:text-5xl font-bold mb-2">Selamat Datang di Absensi Expo</h1>
    <p class="text-lg text-gray-300">SMKN 3 Payakumbuh</p>
  </div>

  <!-- BUTTONS -->
  <div class="flex gap-4 mb-8 fade-slide">
    <button id="btnGuru" class="bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded-xl shadow-lg transition-all duration-300">Masuk sebagai Guru</button>
    <button id="btnSiswa" class="bg-green-600 hover:bg-green-700 text-white py-2 px-4 rounded-xl shadow-lg transition-all duration-300">Masuk sebagai Siswa</button>
  </div>

  <!-- FORM GURU -->
  <form id="formGuru" class="w-80 bg-gray-800 p-6 rounded-2xl shadow-xl space-y-4 hidden fade-slide">
    <h2 class="text-xl font-semibold text-center mb-2">Form Absensi Guru</h2>
    <input type="text" id="namaGuru" placeholder="Nama Lengkap" class="w-full px-4 py-2 rounded-xl bg-gray-700 text-white focus:outline-none">
    <input type="text" id="mapelGuru" placeholder="Mata Pelajaran" class="w-full px-4 py-2 rounded-xl bg-gray-700 text-white focus:outline-none">
    <input type="text" id="kodeGuru" placeholder="Masukkan Kode" class="w-full px-4 py-2 rounded-xl bg-gray-700 text-white focus:outline-none">
    <button type="submit" class="bg-blue-500 hover:bg-blue-600 w-full py-2 rounded-xl shadow-md transition">Kirim</button>
  </form>

  <!-- FORM SISWA -->
  <form id="formSiswa" class="w-80 bg-gray-800 p-6 rounded-2xl shadow-xl space-y-4 hidden fade-slide">
    <h2 class="text-xl font-semibold text-center mb-2">Form Absensi Siswa</h2>
    <input type="text" id="namaSiswa" placeholder="Nama Lengkap" class="w-full px-4 py-2 rounded-xl bg-gray-700 text-white focus:outline-none">
    <input type="text" id="kelasSiswa" placeholder="Kelas" class="w-full px-4 py-2 rounded-xl bg-gray-700 text-white focus:outline-none">
    <input type="text" id="asalSiswa" placeholder="Asal Sekolah" class="w-full px-4 py-2 rounded-xl bg-gray-700 text-white focus:outline-none">
    <input type="text" id="kodeSiswa" placeholder="Masukkan Kode" class="w-full px-4 py-2 rounded-xl bg-gray-700 text-white focus:outline-none">
    <button type="submit" class="bg-green-500 hover:bg-green-600 w-full py-2 rounded-xl shadow-md transition">Kirim</button>
  </form>

  <!-- FOOTER -->
  <p class="mt-12 text-sm text-gray-400 fade-slide w-full text-center">
    Powered by <span class="text-blue-400 font-bold">Gemini</span> | Created by <span class="font-semibold">TKJ Class XI SMKN 3 Payakumbuh</span>
  </p>

  <!-- ADMIN BUTTON -->
  <button id="btnAdmin" class="fixed bottom-4 right-4 bg-gray-700 hover:bg-gray-600 text-white p-3 rounded-full shadow-lg transition">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 12c2.28 0 4-1.72 4-4s-1.72-4-4-4-4 1.72-4 4 1.72 4 4 4zM4 20v-1c0-2.67 5.33-4 8-4s8 1.33 8 4v1H4z" />
    </svg>
  </button>

  <!-- NOTIFIKASI -->
  <div id="notif" class="notif hidden text-center text-white"></div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCKn6AnyFBAVKIZW0hkdUl2rxRPKuEg_uE",
      authDomain: "projects-tkj.firebaseapp.com",
      databaseURL: "https://projects-tkj-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "projects-tkj",
      storageBucket: "projects-tkj.appspot.com",
      messagingSenderId: "1068028451955",
      appId: "1:1068028451955:web:3b157a492ddcb062199e06",
      measurementId: "G-4Y9REYFPCN"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const btnGuru = document.getElementById('btnGuru');
    const btnSiswa = document.getElementById('btnSiswa');
    const formGuru = document.getElementById('formGuru');
    const formSiswa = document.getElementById('formSiswa');
    const notif = document.getElementById('notif');
    const kodeBenar = "214356";
    const adminPass = "admin123";

    function showNotif(text, color) {
      notif.textContent = text;
      notif.className = `notif bg-${color}-600`;
      notif.classList.remove('hidden');
      setTimeout(() => notif.classList.add('hidden'), 3000);
    }

    btnGuru.addEventListener('click', () => {
      formGuru.classList.remove('hidden');
      formSiswa.classList.add('hidden');
    });

    btnSiswa.addEventListener('click', () => {
      formSiswa.classList.remove('hidden');
      formGuru.classList.add('hidden');
    });

    formGuru.addEventListener('submit', function(e) {
      e.preventDefault();
      const nama = document.getElementById('namaGuru').value.trim();
      const mapel = document.getElementById('mapelGuru').value.trim();
      const kode = document.getElementById('kodeGuru').value.trim();
      if (kode === kodeBenar) {
        db.ref('absensi_guru').push({ nama, mapel, waktu: new Date().toLocaleString() });
        showNotif('Data Guru berhasil dikirim!', 'green');
        this.reset();
      } else {
        showNotif('Kode salah! Cek ke panitia.', 'red');
      }
    });

    formSiswa.addEventListener('submit', function(e) {
      e.preventDefault();
      const nama = document.getElementById('namaSiswa').value.trim();
      const kelas = document.getElementById('kelasSiswa').value.trim();
      const asal = document.getElementById('asalSiswa').value.trim();
      const kode = document.getElementById('kodeSiswa').value.trim();
      if (kode === kodeBenar) {
        db.ref('absensi_siswa').push({ nama, kelas, asal, waktu: new Date().toLocaleString() });
        showNotif('Data Siswa berhasil dikirim!', 'green');
        this.reset();
      } else {
        showNotif('Kode salah! Cek ke panitia.', 'red');
      }
    });

    document.getElementById('btnAdmin').addEventListener('click', () => {
      const input = prompt("Masukkan password admin:");
      if (input === adminPass) {
        window.location.href = "admin.html";
      } else if (input !== null) {
        showNotif('Password salah!', 'red');
      }
    });
  </script>
</body>
</html>
