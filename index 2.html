<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expo SMK 3 Payakumbuh</title>

  <!-- Font dari Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

  <style>
    @font-face {
      font-family: 'Monopack';
      src: url('fonts/Monopack-Personal_Use.ttf') format('truetype');
    }

    body {
      margin: 0;
      font-family: 'Monopack', cursive;
      background-color: #ffffff;
      color: #000000;
      animation: fadeInBody 1s ease-in;
    }

    @keyframes fadeInBody {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    header {
      background-color: #003366;
      color: #ffffff;
      padding: 30px;
      text-align: center;
      border-bottom-left-radius: 20px;
      border-bottom-right-radius: 20px;
      animation: slideDown 0.8s ease-out;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-50px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .promo-container {
      padding: 50px 30px;
      text-align: center;
      background-color: #f0f8ff;
      border-radius: 20px;
      margin: 30px;
    }

    .promo-container h2 {
      font-size: 2.2em;
      color: #003366;
      margin-bottom: 20px;
    }

    .image-row {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
      margin-top: 30px;
    }

    .image-row img {
      width: 100%;
      max-width: 400px;
      border: 4px solid #003366;
      border-radius: 20px;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .image-row img:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }

    footer {
      text-align: center;
      margin-top: 40px;
      padding: 20px;
      font-size: 1em;
      color: #003366;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <h1>SELAMAT DATANG DI EXPO SMK 3 PAYAKUMBUH 2025</h1>
  </header>

  <div class="promo-container">
    <h2>Ingin Terlihat Keren Dan Inovatif? <br>Ayo Gabung ke TKJ Sekarang Juga</h2>

    <div class="image-row">

      <img src="c:\Users\HP\Pictures\Gambar WhatsApp 2025-05-02 pukul 21.39.53_7cdb1e7a.jpg " alt="TKJ Expo 2" />
    </div>
  </div>

  <footer>
    Made Directly by XI TKJ • SMKN 3 PAYAKUMBUH
  </footer>

</body>
</html>
